name: Bug Report
description: Report a bug in the PAM Python SDK
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the sections below.

  - type: input
    id: version
    attributes:
      label: SDK Version
      description: "Output of `python -c \"import portable_ai_memory; print(portable_ai_memory.__version__)\"`"
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python Version
      description: "Output of `python --version`"
      placeholder: "3.12.0"
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Models (Pydantic)
        - Validation
        - I/O (load/save)
        - Converter - ChatGPT/OpenAI
        - Converter - Claude/Anthropic
        - Converter - Gemini/Google
        - Converter - Grok/xAI
        - Converter - Copilot/Microsoft
        - CLI
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Minimal code or CLI commands to reproduce the issue.
      render: python
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Additional Context
      description: Traceback, screenshots, or anything else relevant.
